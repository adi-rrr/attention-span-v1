openapi: 3.1.0
info:
  title: Attention Span API
  version: 0.1.0
  description: |
    v1 API for intentional save-for-later app.
    Auth via Bearer JWT from Clerk/Supabase (auth_provider_id → users).

servers:
  - url: http://localhost:3001
    description: Local

tags:
  - name: me
  - name: saves
  - name: folders
  - name: search
  - name: reminders
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

    Platform:
      type: string
      enum: [instagram, reddit, substack, youtube, screenshot]

    SaveStatus:
      type: string
      enum:
        - created
        - preview_ready
        - understand_pending
        - understand_done
        - done
        - archived
        - deleted

    ContentKind:
      type: string
      enum: [place, content, other]

    OfflinePolicy:
      type: string
      enum: [full, light]

    Folder:
      type: object
      required: [id, name, depth, path, parent_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        depth: { type: integer, minimum: 1, maximum: 5 }
        path: { type: string, example: "Trips / Japan 2026 / Food" }
        parent_id: { type: string, format: uuid, nullable: true }
        sort_order: { type: integer }
        save_count: { type: integer }

    Save:
      type: object
      required: [id, platform, status, title, offline_policy]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: "#/components/schemas/Platform" }
        status: { $ref: "#/components/schemas/SaveStatus" }
        source_url: { type: string, nullable: true }
        title: { type: string }
        user_note: { type: string, nullable: true }
        folder_id: { type: string, format: uuid, nullable: true }
        folder_path: { type: string }
        content_kind:
          allOf: [{ $ref: "#/components/schemas/ContentKind" }]
          nullable: true
        offline_policy: { $ref: "#/components/schemas/OfflinePolicy" }
        has_reminder: { type: boolean }
        reminder_fire_at: { type: string, format: date-time, nullable: true }
        reminder:
          allOf: [{ $ref: "#/components/schemas/Reminder" }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DuplicateConflict:
      type: object
      required: [existing_save_id, saved_at, message]
      properties:
        existing_save_id: { type: string, format: uuid }
        saved_at: { type: string, format: date-time }
        message:
          type: string
          example: Already saved on Mar 1. Replace it?

    CreateSaveRequest:
      type: object
      required: [platform]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUID (share extension)
        platform: { $ref: "#/components/schemas/Platform" }
        source_url: { type: string, nullable: true }
        title: { type: string }
        replace_existing:
          type: boolean
          description: Required true when resolving duplicate URL popup with Replace
          default: false

    SearchResult:
      type: object
      required: [save_id, title, platform, match_snippet, match_field]
      properties:
        save_id: { type: string, format: uuid }
        title: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        folder_path: { type: string }
        match_snippet: { type: string }
        match_field:
          type: string
          enum: [understand, note, folder, title]
        has_reminder: { type: boolean }
        content_kind:
          allOf: [{ $ref: "#/components/schemas/ContentKind" }]
          nullable: true
        offline_available:
          type: string
          enum: [full, light]

    MeSettings:
      type: object
      properties:
        timezone: { type: string }
        max_folder_depth: { type: integer }
        default_reminder_hour: { type: integer }
        notifications_enabled: { type: boolean }

    Reminder:
      type: object
      properties:
        id: { type: string, format: uuid }
        save_id: { type: string, format: uuid }
        fire_at: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, sent, cancelled]
        delivery:
          type: string
          enum: [in_app, calendar, both]
        calendar_provider:
          type: string
          enum: [apple, google]
          nullable: true

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /me:
    get:
      tags: [me]
      summary: Current user profile + settings
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      display_name: { type: string }
                  - { $ref: "#/components/schemas/MeSettings" }

  /me/settings:
    get:
      tags: [me]
      summary: Settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeSettings" }
    patch:
      tags: [me]
      summary: Update settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone: { type: string }
                default_reminder_hour: { type: integer }
                notifications_enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeSettings" }

  /saves:
    get:
      tags: [saves]
      summary: List saves
      parameters:
        - name: status
          in: query
          schema:
            type: string
            description: Comma-separated SaveStatus values
        - name: folder_id
          in: query
          schema: { type: string, format: uuid }
        - name: uncategorized
          in: query
          description: If true, only saves with folder_id null (exact folder, not subtree)
          schema: { type: boolean }
        - name: platform
          in: query
          schema: { $ref: "#/components/schemas/Platform" }
        - name: inbox
          in: query
          description: If true, only saves still in the inbox
          schema: { type: boolean }
      responses:
        "200":
          description: Save list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Save" }
    post:
      tags: [saves]
      summary: Create save from share (or replace existing URL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSaveRequest" }
      responses:
        "201":
          description: Created (or replaced)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Save" }
        "409":
          description: Duplicate URL — client must show Replace / Cancel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateConflict" }

  /saves/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [saves]
      summary: Save detail
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Save" }
        "404":
          description: Not found
    patch:
      tags: [saves]
      summary: Update note, folder, status (done/archived)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_note: { type: string, nullable: true }
                folder_id: { type: string, format: uuid, nullable: true }
                title: { type: string }
                status:
                  type: string
                  enum: [understand_done, done, archived]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Save" }
    delete:
      tags: [saves]
      summary: Soft-delete save
      responses:
        "204":
          description: Deleted

  /folders:
    get:
      tags: [folders]
      summary: Folder tree for current user
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Folder" }
    post:
      tags: [folders]
      summary: Create folder (rejects if depth > max_folder_depth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400":
          description: Depth exceeded or invalid parent

  /folders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [folders]
      summary: Rename, reorder, or move folder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parent_id: { type: string, format: uuid, nullable: true }
                sort_order: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
    delete:
      tags: [folders]
      summary: Soft-delete folder and everything inside (subfolders + saves)
      responses:
        "204":
          description: Deleted
        "404":
          description: Folder not found

  /search:
    get:
      tags: [search]
      summary: Intent-weighted search (Understand > note > folder > title)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }

  /saves/{id}/reminder:
    get:
      tags: [reminders]
      summary: Active scheduled reminder for save
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "404":
          description: No scheduled reminder
    post:
      tags: [reminders]
      summary: Create or replace reminder for save (one active reminder per save)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fire_at]
              properties:
                fire_at: { type: string, format: date-time }
                timezone: { type: string }
                delivery:
                  type: string
                  enum: [in_app, calendar, both]
                  default: in_app
                calendar_provider:
                  type: string
                  enum: [apple, google]
                  nullable: true
                created_from:
                  type: string
                  enum: [understand_answer, manual]
                  default: manual
      responses:
        "200":
          description: Reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400":
          description: Time in the past or invalid
    delete:
      tags: [reminders]
      summary: Cancel the active reminder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Cancelled
