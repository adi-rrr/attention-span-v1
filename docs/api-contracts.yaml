openapi: 3.1.0
info:
  title: Attention Span API
  version: 0.1.0
  description: |
    v1 API for intentional save-for-later app.
    Auth via Bearer JWT from Clerk/Supabase (auth_provider_id → users).

servers:
  - url: http://localhost:3001
    description: Local

tags:
  - name: me
  - name: saves
  - name: understand
  - name: folders
  - name: search
  - name: reminders
  - name: map

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

    Platform:
      type: string
      enum: [instagram, reddit, substack, youtube, screenshot]

    SaveStatus:
      type: string
      enum:
        - created
        - preview_ready
        - understand_pending
        - understand_done
        - done
        - archived
        - deleted

    ContentKind:
      type: string
      enum: [place, content, other]

    OfflinePolicy:
      type: string
      enum: [full, light]

    QaPair:
      type: object
      properties:
        question: { type: string }
        answer: { type: string }
        asked_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time, nullable: true }

    Folder:
      type: object
      required: [id, name, depth, path, parent_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        depth: { type: integer, minimum: 1, maximum: 5 }
        path: { type: string, example: "Trips / Japan 2026 / Food" }
        parent_id: { type: string, format: uuid, nullable: true }
        sort_order: { type: integer }
        save_count: { type: integer }

    Save:
      type: object
      required: [id, platform, status, title, offline_policy]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: "#/components/schemas/Platform" }
        status: { $ref: "#/components/schemas/SaveStatus" }
        source_url: { type: string, nullable: true }
        title: { type: string }
        user_note: { type: string, nullable: true }
        folder_id: { type: string, format: uuid, nullable: true }
        folder_path: { type: string }
        content_kind:
          allOf: [{ $ref: "#/components/schemas/ContentKind" }]
          nullable: true
        offline_policy: { $ref: "#/components/schemas/OfflinePolicy" }
        understand_skipped: { type: boolean, default: false }
        understand_snippet: { type: string }
        qa_pairs:
          type: array
          items: { $ref: "#/components/schemas/QaPair" }
        has_reminder: { type: boolean }
        reminder_fire_at: { type: string, format: date-time, nullable: true }
        reminder:
          allOf: [{ $ref: "#/components/schemas/Reminder" }]
          nullable: true
        has_map_pin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DuplicateConflict:
      type: object
      required: [existing_save_id, saved_at, message]
      properties:
        existing_save_id: { type: string, format: uuid }
        saved_at: { type: string, format: date-time }
        message:
          type: string
          example: Already saved on Mar 1. Replace it?

    CreateSaveRequest:
      type: object
      required: [platform]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated UUID (share extension)
        platform: { $ref: "#/components/schemas/Platform" }
        source_url: { type: string, nullable: true }
        title: { type: string }
        replace_existing:
          type: boolean
          description: Required true when resolving duplicate URL popup with Replace
          default: false

    UnderstandStartResponse:
      type: object
      required: [session_id, status, question, ai_turn_count, skips_remaining]
      properties:
        session_id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, in_progress, completed, skipped]
        question: { type: string }
        ai_turn_count: { type: integer }
        skips_remaining: { type: integer }
        can_skip: { type: boolean }

    UnderstandAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1 }

    UnderstandAnswerResponse:
      type: object
      required: [done]
      properties:
        done: { type: boolean }
        next_question: { type: string, nullable: true }
        ai_turn_count: { type: integer }
        suggestions:
          type: object
          properties:
            reminder:
              type: object
              nullable: true
              properties:
                suggested_fire_at: { type: string, format: date-time }
                label: { type: string }
            map_pin:
              type: object
              nullable: true
              properties:
                label: { type: string }
                lat: { type: number }
                lng: { type: number }

    UnderstandCompleteRequest:
      type: object
      properties:
        folder_id: { type: string, format: uuid, nullable: true }
        content_kind: { $ref: "#/components/schemas/ContentKind" }
        user_note: { type: string, nullable: true }
        reminder:
          type: object
          nullable: true
          properties:
            fire_at: { type: string, format: date-time }
            delivery:
              type: string
              enum: [in_app, calendar, both]
              default: in_app
            calendar_provider:
              type: string
              enum: [apple, google]
              nullable: true
        map_pin:
          type: object
          nullable: true
          properties:
            lat: { type: number }
            lng: { type: number }
            label: { type: string }

    SearchResult:
      type: object
      required: [save_id, title, platform, match_snippet, match_field]
      properties:
        save_id: { type: string, format: uuid }
        title: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        folder_path: { type: string }
        match_snippet: { type: string }
        match_field:
          type: string
          enum: [understand, note, folder, title]
        has_reminder: { type: boolean }
        has_map_pin: { type: boolean }
        content_kind:
          allOf: [{ $ref: "#/components/schemas/ContentKind" }]
          nullable: true
        offline_available:
          type: string
          enum: [full, light]

    MeSettings:
      type: object
      properties:
        timezone: { type: string }
        skips_remaining: { type: integer }
        max_skips: { type: integer }
        skip_window_days: { type: integer }
        max_folder_depth: { type: integer }
        default_reminder_hour: { type: integer }
        notifications_enabled: { type: boolean }

    Reminder:
      type: object
      properties:
        id: { type: string, format: uuid }
        save_id: { type: string, format: uuid }
        fire_at: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, sent, cancelled]
        delivery:
          type: string
          enum: [in_app, calendar, both]
        calendar_provider:
          type: string
          enum: [apple, google]
          nullable: true

    MapPin:
      type: object
      properties:
        id: { type: string, format: uuid }
        save_id: { type: string, format: uuid }
        lat: { type: number }
        lng: { type: number }
        label: { type: string }
        source:
          type: string
          enum: [user_answer, geocoded, manual_adjust]

    SyncConflict:
      type: object
      description: Multi-device conflict — client shows Confirm / Discard
      properties:
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        local_preview: { type: object }
        server_preview: { type: object }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /me:
    get:
      tags: [me]
      summary: Current user profile + settings + skip quota
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      display_name: { type: string }
                  - { $ref: "#/components/schemas/MeSettings" }

  /me/settings:
    get:
      tags: [me]
      summary: Settings and skip quota
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeSettings" }
    patch:
      tags: [me]
      summary: Update settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone: { type: string }
                default_reminder_hour: { type: integer }
                notifications_enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeSettings" }

  /saves:
    get:
      tags: [saves]
      summary: List saves
      parameters:
        - name: status
          in: query
          schema:
            type: string
            description: Comma-separated SaveStatus values
        - name: folder_id
          in: query
          schema: { type: string, format: uuid }
        - name: uncategorized
          in: query
          description: If true, only saves with folder_id null (exact folder, not subtree)
          schema: { type: boolean }
        - name: platform
          in: query
          schema: { $ref: "#/components/schemas/Platform" }
        - name: inbox
          in: query
          description: If true, only understand_pending / skipped
          schema: { type: boolean }
      responses:
        "200":
          description: Save list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Save" }
    post:
      tags: [saves]
      summary: Create save from share (or replace existing URL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSaveRequest" }
      responses:
        "201":
          description: Created (or replaced)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Save" }
        "409":
          description: Duplicate URL — client must show Replace / Cancel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateConflict" }

  /saves/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [saves]
      summary: Save detail
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Save" }
        "404":
          description: Not found
    patch:
      tags: [saves]
      summary: Update note, folder, status (done/archived)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_note: { type: string, nullable: true }
                folder_id: { type: string, format: uuid, nullable: true }
                title: { type: string }
                status:
                  type: string
                  enum: [understand_done, done, archived]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Save" }
    delete:
      tags: [saves]
      summary: Soft-delete save
      responses:
        "204":
          description: Deleted

  /saves/{id}/understand/start:
    post:
      tags: [understand]
      summary: Start or resume Understand session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: First / next question
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnderstandStartResponse" }

  /saves/{id}/understand/answer:
    post:
      tags: [understand]
      summary: Submit answer; get next question or suggestions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnderstandAnswerRequest" }
      responses:
        "200":
          description: Continue or ready to complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnderstandAnswerResponse" }

  /saves/{id}/understand/complete:
    post:
      tags: [understand]
      summary: Finish Understand — content_kind, folder, reminder, map (after last Q)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnderstandCompleteRequest" }
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Save" }

  /saves/{id}/understand/skip:
    post:
      tags: [understand]
      summary: Answer later (consumes skip quota if available)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Skipped; save stays in Inbox for revisit
          content:
            application/json:
              schema:
                type: object
                properties:
                  skips_remaining: { type: integer }
                  save: { $ref: "#/components/schemas/Save" }
        "403":
          description: Skip quota exhausted

  /folders:
    get:
      tags: [folders]
      summary: Folder tree for current user
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Folder" }
    post:
      tags: [folders]
      summary: Create folder (rejects if depth > max_folder_depth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "400":
          description: Depth exceeded or invalid parent

  /folders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [folders]
      summary: Rename, reorder, or move folder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parent_id: { type: string, format: uuid, nullable: true }
                sort_order: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
    delete:
      tags: [folders]
      summary: Soft-delete folder and everything inside (subfolders + saves)
      responses:
        "204":
          description: Deleted
        "404":
          description: Folder not found

  /search:
    get:
      tags: [search]
      summary: Intent-weighted search (Understand > note > folder > title)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }

  /saves/{id}/reminder:
    get:
      tags: [reminders]
      summary: Active scheduled reminder for save
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "404":
          description: No scheduled reminder
    post:
      tags: [reminders]
      summary: Create or replace reminder for save (one active reminder per save)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fire_at]
              properties:
                fire_at: { type: string, format: date-time }
                timezone: { type: string }
                delivery:
                  type: string
                  enum: [in_app, calendar, both]
                  default: in_app
                calendar_provider:
                  type: string
                  enum: [apple, google]
                  nullable: true
                created_from:
                  type: string
                  enum: [understand_answer, manual]
                  default: manual
      responses:
        "200":
          description: Reminder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400":
          description: Time in the past or invalid
    delete:
      tags: [reminders]
      summary: Cancel the active reminder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Cancelled

  /map/pins:
    get:
      tags: [map]
      summary: Pins in viewport (place-type saves)
      parameters:
        - name: west
          in: query
          schema: { type: number }
        - name: south
          in: query
          schema: { type: number }
        - name: east
          in: query
          schema: { type: number }
        - name: north
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Pins
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MapPin" }

  /saves/{id}/map-pin:
    post:
      tags: [map]
      summary: Create or adjust map pin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                label: { type: string }
                source:
                  type: string
                  enum: [user_answer, geocoded, manual_adjust]
      responses:
        "200":
          description: Pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapPin" }

  /sync/push:
    post:
      tags: [me]
      summary: Push pending local changes; may return conflicts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                changes:
                  type: array
                  items:
                    type: object
                    properties:
                      entity_type: { type: string }
                      entity_id: { type: string, format: uuid }
                      revision: { type: integer }
                      payload: { type: object }
      responses:
        "200":
          description: Applied and/or conflicts
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: array
                    items: { type: string, format: uuid }
                  conflicts:
                    type: array
                    items: { $ref: "#/components/schemas/SyncConflict" }
