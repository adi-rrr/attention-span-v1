<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soft · Reminder moment</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B4BC4}a:hover{color:#3434A0}
@keyframes breathe{0%,100%{transform:scale(1);opacity:0.85}50%{transform:scale(1.08);opacity:1}}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF0FB; color: #1E1B3A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 20px 24px">
<div aria-hidden="true" style="position: absolute; top: 40px; left: 50%; margin-left: -170px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFD3B8, #F7A9C4 45%, #C9CCFF 80%); filter: blur(28px); animation: breathe 6s ease-in-out infinite"></div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px">
<button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.75); color: #1E1B3A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.8); font-size: 13px; font-weight: 700">Sun 1 Mar · 10:00</div>
<div style="width: 44px"></div>
</div>
<div style="position: relative; margin-top: 70px; text-align: center; font-size: 15px; font-weight: 600; color: #3E3B5C">A note from you, 3 months ago</div>
<blockquote style="position: relative; margin: 14px 6px 0; text-align: center; font-size: 32px; line-height: 1.18; font-weight: 800; letter-spacing: -0.025em">“Want to eat here when I'm in Tokyo in March”</blockquote>
<div style="position: relative; margin-top: 40px; padding: 12px; border-radius: 24px; background: rgba(255,255,255,0.85); display: flex; gap: 12px; align-items: center; box-shadow: 0 20px 40px -22px rgba(60,60,140,0.5)">
<div style="width: 60px; height: 60px; border-radius: 18px; flex: none; background: linear-gradient(140deg, #FFB38A, #F27A9B)"></div>
<div style="min-width: 0">
<div style="font-size: 14px; font-weight: 700; line-height: 1.3">Tiny ramen counter in Shibuya with no sign outside</div>
<div style="margin-top: 2px; font-size: 12px; color: #5D5A7A">Instagram · Japan 2026 › Food</div>
</div>
</div>
<div style="position: relative; margin-top: 12px; padding: 14px 16px; border-radius: 20px; background: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.45; color: #3E3B5C">Anytime near Shibuya. Go early, there's always a queue.</div>
<div style="flex: 1"></div>
<button style="position: relative; min-height: 56px; border-radius: 999px; border: 0; background: #5B5BD6; color: #FFFFFF; font: 700 16px 'Plus Jakarta Sans', sans-serif; box-shadow: 0 14px 30px -14px rgba(91,91,214,0.9)">I did it</button>
<div style="position: relative; margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="min-height: 48px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1E1B3A; font: 600 15px 'Plus Jakarta Sans', sans-serif">Remind me later</button>
<button style="min-height: 48px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1E1B3A; font: 600 15px 'Plus Jakarta Sans', sans-serif">Open reel</button>
</div>
</div>
</body>
</html>
