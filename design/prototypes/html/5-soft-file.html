<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soft · File &amp; remind</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4B4BC4}a:hover{color:#3434A0}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF0FB; color: #1E1B3A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 20px 24px">
<div aria-hidden="true" style="position: absolute; bottom: 60px; right: -110px; width: 280px; height: 280px; border-radius: 50%; background: #FFD3B8; filter: blur(40px); opacity: 0.8"></div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px">
<button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.75); color: #1E1B3A; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px -6px rgba(60,60,140,0.25)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<div style="font-size: 14px; font-weight: 700">Nearly there</div>
<div style="width: 44px"></div>
</div>
<h1 style="position: relative; margin: 20px 0 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Give it a home</h1>
<div style="position: relative; margin-top: 4px; font-size: 14px; color: #5D5A7A">Trips › Japan 2026</div>
<div style="position: relative; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px">
<button style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: #5B5BD6; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px -12px rgba(91,91,214,0.8)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Food</button>
<button style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1E1B3A; font: 600 15px 'Plus Jakarta Sans', sans-serif">Stays</button>
<button style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1E1B3A; font: 600 15px 'Plus Jakarta Sans', sans-serif">Day trips</button>
<button style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: #FFFFFF; color: #1E1B3A; font: 600 15px 'Plus Jakarta Sans', sans-serif">Shopping</button>
<button style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px dashed #A9AAE0; background: transparent; color: #4B4BC4; font: 600 15px 'Plus Jakarta Sans', sans-serif">+ New</button>
</div>
<button style="position: relative; margin-top: 12px; align-self: flex-start; min-height: 44px; border: 0; background: transparent; color: #4B4BC4; font: 600 14px 'Plus Jakarta Sans', sans-serif; padding: 0">Browse all folders</button>
<div style="position: relative; margin-top: 18px; padding: 20px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 24px 50px -24px rgba(60,60,140,0.45)">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 13px; font-weight: 700; color: #5D5A7A">Gentle nudge</div>
<div role="img" aria-label="Reminder on" style="width: 48px; height: 28px; border-radius: 14px; background: #5B5BD6; position: relative"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></div>
</div>
<div style="margin-top: 14px; display: flex; align-items: center; gap: 14px">
<div style="width: 60px; height: 64px; border-radius: 18px; background: #F1F1FF; display: flex; flex-direction: column; align-items: center; justify-content: center"><div style="font-size: 11px; font-weight: 800; color: #4B4BC4">MAR</div><div style="font-size: 24px; font-weight: 800; line-height: 1">1</div></div>
<div>
<div style="font-size: 18px; font-weight: 800">Sunday, 10:00 am</div>
<div style="margin-top: 2px; font-size: 13px; color: #5D5A7A">Two weeks before Tokyo</div>
</div>
</div>
<div style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap">
<button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #F1F1FF; color: #3434A0; font: 600 13px 'Plus Jakarta Sans', sans-serif">1 week before</button>
<button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #F1F1FF; color: #3434A0; font: 600 13px 'Plus Jakarta Sans', sans-serif">On arrival</button>
<button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #F1F1FF; color: #3434A0; font: 600 13px 'Plus Jakarta Sans', sans-serif">Pick a date</button>
</div>
</div>
<div style="flex: 1"></div>
<button style="position: relative; min-height: 56px; border-radius: 999px; border: 0; background: #1E1B3A; color: #FFFFFF; font: 700 16px 'Plus Jakarta Sans', sans-serif">Save it</button>
</div>
</body>
</html>
